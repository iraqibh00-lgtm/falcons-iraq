name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5.0.0 @capacitor/android@5.0.0
          npm install -g @capacitor/cli@5.0.0

      - name: Init and build
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            *{margin:0;padding:0}
            body{background:#000}
            iframe{
              position:fixed;
              top:0;left:0;
              width:100%;height:100%;
              border:none;
            }
          </style>
          </head>
          <body>
          <iframe src="https://iraqibh00-lgtm.github.io/falcons-iraq/" 
                  allow="geolocation; notifications; camera; microphone">
          </iframe>
          </body>
          </html>
          EOF
          npx cap init "FalconsIraq" "com.iraqibh.falcons" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add Permissions
        run: |
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <service android:name=".FloatingWidgetService" android:enabled="true" android:exported="false"\/>\n<\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Add Floating Widget
        run: |
          cat > android/app/src/main/java/com/iraqibh/falcons/MainActivity.java << 'EOF'
          package com.iraqibh.falcons;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (!Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION);
                      startActivity(intent);
                  }
                  stopService(new Intent(this, FloatingWidgetService.class));
              }

              @Override
              public void onStop() {
                  super.onStop();
                  if (Settings.canDrawOverlays(this)) {
                      startService(new Intent(this, FloatingWidgetService.class));
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  stopService(new Intent(this, FloatingWidgetService.class));
              }
          }
          EOF

          cat > android/app/src/main/java/com/iraqibh/falcons/FloatingWidgetService.java << 'EOF'
          package com.iraqibh.falcons;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.ImageView;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private View floatingView;
              private WindowManager.LayoutParams params;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingView = new ImageView(this);
                  ((ImageView) floatingView).setImageResource(R.mipmap.ic_launcher);
                  params = new WindowManager.LayoutParams(
                      150, 150,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.LEFT;
                  params.x = 0;
                  params.y = 100;
                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      int initialX, initialY;
                      float initialTouchX, initialTouchY;
                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int)(event.getRawX() - initialTouchX);
                                  params.y = initialY + (int)(event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (Math.abs(event.getRawX() - initialTouchX) < 10 &&
                                      Math.abs(event.getRawY() - initialTouchY) < 10) {
                                      Intent i = new Intent(FloatingWidgetService.this, MainActivity.class);
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(i);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });
                  windowManager.addView(floatingView, params);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null) windowManager.removeView(floatingView);
              }
          }
          EOF

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Add Icon
        run: |
          ICON=$(find . -maxdepth 1 -name "*.png" | head -1)
          if [ -z "$ICON" ]; then
            echo "خطأ: لم يتم العثور على ملف PNG!"
            exit 1
          fi
          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            DIR="android/app/src/main/res/mipmap-$density"
            mkdir -p $DIR
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_round.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_foreground.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_background.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
