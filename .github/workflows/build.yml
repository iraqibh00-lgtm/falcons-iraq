name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5.0.0 @capacitor/android@5.0.0
          npm install -g @capacitor/cli@5.0.0

      - name: Init and build
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "FalconsIraq" "com.iraqibh.falcons" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add Icon
        run: |
          Icon=$(ls *.png | head -1)
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$size
            cp $Icon android/app/src/main/res/mipmap-$size/ic_launcher.png
            cp $Icon android/app/src/main/res/mipmap-$size/ic_launcher_round.png
            cp $Icon android/app/src/main/res/mipmap-$size/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
