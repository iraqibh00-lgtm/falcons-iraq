name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5.0.0 @capacitor/android@5.0.0
          npm install -g @capacitor/cli@5.0.0

      - name: Init and build
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "FalconsIraq" "com.iraqibh.falcons" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Add Icon
        run: |
          echo "=== الملفات الموجودة ==="
          ls -la
          echo "=== ملفات PNG ==="
          find . -name "*.png" 2>/dev/null
          
          ICON=$(find . -maxdepth 1 -name "*.png" | head -1)
          echo "الأيقونة المختارة: $ICON"
          
          if [ -z "$ICON" ]; then
            echo "خطأ: لم يتم العثور على ملف PNG!"
            exit 1
          fi
          
          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            DIR="android/app/src/main/res/mipmap-$density"
            mkdir -p $DIR
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_round.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_foreground.png
            convert $ICON -resize ${size}x${size} $DIR/ic_launcher_background.png
            echo "✅ تم: $density ($size x $size)"
          done
          
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "✅ تم حذف mipmap-anydpi-v26"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
